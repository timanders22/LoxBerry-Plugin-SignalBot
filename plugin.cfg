[AUTHOR]
NAME=Signal Bot LoxBerry Plugin Authors
EMAIL=signalbot-loxberry@users.noreply.github.com

[PLUGIN]
VERSION=0.9.15
NAME=signalbot
FOLDER=signalbot
TITLE=Signal Bot - Befehle per Chat

[AUTOUPDATE]
# Selbstaktualisierung ueber das EIGENE Repository. Beide Adressen zeigen auf
# den Zweig master - LoxBerry liest die Fassung dort und vergleicht sie mit der
# oben. Solange beide 0.9.2 lauten, wird niemandem etwas angeboten; sobald der
# Zweig eine hoehere Fassung fuehrt, greift die Aktualisierung von selbst.
#
# Adressen NIE auf ein fremdes Repository richten: LoxBerry vergleicht
# Fassungen als Zahl, und ein fremdes 2021.05.14 waere groesser als 1.0.0 -
# daraus wuerde ein stilles Downgrade (Hausregel, belegt am Docker-Plugin).
AUTOMATIC_UPDATES=true
RELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-SignalBot/master/release.cfg
PRERELEASECFG=https://raw.githubusercontent.com/timanders22/LoxBerry-Plugin-SignalBot/master/prerelease.cfg

[SYSTEM]
INTERFACE=2.0
REBOOT=false
LB_MINIMUM=3.0.0
LB_MAXIMUM=false
# ARCHITECTURE bleibt aus.
#
# Ein Wert mit Komma kommt aus Config::Simple als Feldverweis zurueck; das
# Protokoll zeigt dann "Architecture: ARRAY(0x...)", und plugininstall.pl
# prueft mit is_enabled() - was auf einen Feldverweis nicht zutrifft. Die
# ganze Architekturpruefung wurde damit stillschweigend uebersprungen. Eine
# Angabe, die nichts bewirkt, gehoert nicht in die Datei.
#
# Eine Einschraenkung braucht dieses Plugin ohnehin nicht: postroot.sh
# ermittelt die Architektur selbst und behandelt jeden Fall.
ARCHITECTURE=false
CUSTOM_LOGLEVELS=true
