; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Dieses Plugin macht aus <b>Signal</b> eine Fernbedienung für das Haus: Befehle per Chat an den Miniserver, Meldungen aus Loxone zurück in den Chat. Beide Richtungen."
K02 = "<b>Reihenfolge beim Einrichten:</b>"
K03 = "<i>Einstellungen</i> → <b>Verknüpfung starten</b>. Der QR-Code wird am Handy unter Signal → Einstellungen → Gekoppelte Geräte gescannt. Der Bot hängt sich als Zweitgerät an das eigene Konto, eine zweite Rufnummer braucht es nicht."
K04 = "Die <b>erlaubten Absender</b> eintragen — eine Rufnummer je Zeile. Wer nicht daraufsteht, bekommt keine Antwort."
K05 = "Eine <b>PIN</b> vergeben, wenn kritische Befehle geplant sind."
K06 = "<i>Befehle</i> → die Tabelle füllen. Je Zeile: das Wort, das MQTT-Thema und die Stufe."
K07 = "<i>MQTT</i> → das Abo ins Gateway eintragen. Ohne diesen Eintrag kommt am Miniserver nichts an."
K08 = "<i>Einbindung in Loxone</i> → virtuelle Eingänge auf die Themen legen und die Adresse für Meldungen kopieren."
K09 = "<i>Test</i> → Selbstprüfung ansehen und einen Befehl trocken durchspielen."
K10 = "<b>Zu den Stufen:</b> <i>Sofort</i> führt ohne Rückfrage aus. <i>Rückfrage</i> lässt den Bot nachfragen. <i>PIN</i> verlangt zusätzlich die PIN. Für Alarmanlage und Haustür gehört die Stufe <i>PIN</i>."
K11 = "<b>Wenn nichts ankommt:</b> Der Reiter <i>Test</i> geht die Kette von unten nach oben durch — ist signal-cli installiert, ist Java neu genug, passt die native Bibliothek zur Architektur, läuft der Dienst, antwortet die Schnittstelle, ist ein Konto verknüpft, lauscht der Bot. Der erste Kreuz-Eintrag ist meist die Ursache."
K12 = "<b>Auf dem Raspberry Pi:</b> signal-cli bringt seine native Bibliothek nur für x86_64 mit. Auf ARM muss sie getrennt beschafft werden, oder signal-cli läuft in einem Docker-Abbild mit ARM-Unterstützung und das Plugin bindet nur dessen Adresse ein."
K13 = "Dokumentation zu signal-cli: <a href='https://github.com/AsamK/signal-cli/wiki' target='_blank'>signal-cli-Wiki</a>"
K14 = "<b>Kill-Schalter:</b> Kommt ein Handy abhanden, sperrt der Knopf im Reiter Einstellungen den Bot sofort - er nimmt dann keine Befehle mehr an. Dasselbe geht aus Loxone heraus über zwei Adressen; sie stehen im Reiter Einbindung in Loxone."
K15 = "<b>Dringende Meldungen</b> tragen in der Adresse <span class='sm-mono'>&amp;dringend=1</span>. Sie gehen auch während der Nachtruhe sofort hinaus und werden wiederholt, bis der Empfänger <span class='sm-mono'>quittiert</span> schreibt."
K16 = "<b>Wer darf was:</b> Die Weißliste sagt, wer überhaupt mit dem Bot reden darf. In der Befehlstabelle steht je Zeile, wer genau diesen Befehl auslösen darf und ob eine zweite Person freigeben muss."
