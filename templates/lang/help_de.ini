; Hilfetexte, deutsch. Gehoert zu templates/help/help.html.
; LBWeb::gethelp() leitet den Namen dieser Datei aus dem Namen der
; Hilfedatei ab und sucht sie in templates/lang/ - nicht neben der
; Hilfe. Jeder Wert steht in doppelten Anfuehrungszeichen und enthaelt
; selbst keine; Auszeichnung bleibt roh, die Hilfe wird nicht
; maskiert ausgegeben.

[HILFE]
K01 = "Dieses Plugin macht aus <b>Signal</b> eine Fernbedienung für das Haus: Befehle per Chat an den Miniserver, Meldungen aus Loxone zurück in den Chat. Beide Richtungen."
K02 = "<b>Reihenfolge beim Einrichten:</b>"
K03 = "<i>Einstellungen</i> → <b>Verknüpfung starten</b>. Der QR-Code wird am Handy unter Signal → Einstellungen → Gekoppelte Geräte gescannt. Der Bot hängt sich als Zweitgerät an das eigene Konto, eine zweite Rufnummer braucht es nicht."
K04 = "Die <b>erlaubten Absender</b> eintragen — eine Rufnummer je Zeile. Wer nicht daraufsteht, bekommt keine Antwort."
K05 = "Eine <b>PIN</b> vergeben, wenn kritische Befehle geplant sind."
K06 = "<i>Befehle</i> → die Tabelle füllen. Je Zeile: das Wort, das MQTT-Thema und die Stufe."
K07 = "<i>MQTT</i> → Hausform ist das <b>MQTT&#8209;Gateway&nbsp;V2</b>: dort je Thema einen Haken setzen (Liste „MQTT-Gateway V2: diese Datenpunkte anhaken“ im Reiter MQTT, Lebenszeichen und Chat-Befehle auf <i>Noncached</i>). Unter Gateway V1 trägt das Plugin sein Abo selbst ein. Ein fester Befehl sendet einen Impuls (Wert, nach 1 s 0). Befehle gehen direkt an den MQTT-Broker des LoxBerry (QoS&nbsp;1); bestätigt er den Empfang, antwortet der Bot „an Loxone übergeben, vom MQTT-Broker bestätigt“. Ob ein Befehl im Miniserver ankommt, zeigt nur Loxone."
K08 = "<i>Einbindung in Loxone</i> → Schritt für Schritt: virtuelle Eingänge auf die Themen legen, die beiden Vorlagen erzeugen und in Schritt 8 die zwei Seiten aus dem Musterprojekt (Überwachung und Sicherheit, Befehle und Meldungen) samt Bildern und Anleitung nachbauen."
K09 = "<i>Test</i> → Selbstprüfung ansehen und einen Befehl trocken durchspielen."
K10 = "<b>Zu den Stufen:</b> <i>Sofort</i> führt ohne Rückfrage aus. <i>Rückfrage</i> lässt den Bot nachfragen. <i>PIN</i> verlangt zusätzlich die PIN. Für Alarmanlage und Haustür gehört die Stufe <i>PIN</i>."
K11 = "<b>Wenn nichts ankommt:</b> Der Reiter <i>Test</i> geht die Kette von unten nach oben durch — ist signal-cli installiert, ist Java neu genug, passt die native Bibliothek zur Architektur, läuft der Dienst, antwortet die Schnittstelle, ist ein Konto verknüpft, lauscht der Bot. Der erste Kreuz-Eintrag ist meist die Ursache."
K12 = "<b>Auf dem Raspberry Pi:</b> signal-cli bringt seine native Bibliothek nur für x86_64 mit. Auf ARM muss sie getrennt beschafft werden, oder signal-cli läuft in einem Docker-Abbild mit ARM-Unterstützung und das Plugin bindet nur dessen Adresse ein."
K13 = "Dokumentation zu signal-cli: <a href='https://github.com/AsamK/signal-cli/wiki' target='_blank'>signal-cli-Wiki</a>"
K14 = "<b>Kill-Schalter:</b> Kommt ein Handy abhanden, sperrt der Knopf im Reiter Einstellungen den Bot sofort - er nimmt dann keine Befehle mehr an. Aus Loxone sperrt <span class='sm-mono'>publish signalbot/befehl/sperren 1</span> über das MQTT-Gateway; entsperren aus Loxone nur mit dem zweiten Haken „Entsperren aus Loxone erlauben“ (Reiter MQTT, ab Werk aus)."
K15 = "<b>Dringende Meldungen</b> schickt Loxone als <span class='sm-mono'>publish signalbot/befehl/dringend &lt;Text&gt;</span> (bestehende Anlagen über den HTTP-Endpunkt mit <span class='sm-mono'>&amp;dringend=1</span>). Sie gehen auch während der Nachtruhe sofort hinaus und werden wiederholt, bis der Empfänger <span class='sm-mono'>quittiert</span> schreibt."
K16 = "<b>Wer darf was:</b> Die Weißliste sagt, wer überhaupt mit dem Bot reden darf. In der Befehlstabelle steht je Zeile, wer genau diesen Befehl auslösen darf und ob eine zweite Person freigeben muss."
K17 = "<b>Neu in 0.9.30 – Status über das MQTT&#8209;Gateway&nbsp;V2:</b> der Bot sendet jede Minute <span class='sm-mono'>status/zaehler</span> und <span class='sm-mono'>status/ok</span> (Nachrichten kommen an), dazu bei Änderung Konto, Weißliste, Befehle, Sperre, Abweisungen. Namen der Virtuellen Eingänge im Reiter Einbindung, Schritt 4."
K18 = "<b>Meldungen aus Loxone über die Befehlsbrücke:</b> <span class='sm-mono'>publish signalbot/befehl/senden &lt;Text&gt;</span> an den UDP-Eingang des Gateways – ohne Token. Haken „Befehle über MQTT annehmen“ im Reiter MQTT (ab Werk aus). Der HTTP-Endpunkt ist bei einer Neuinstallation aus; bestehende Anlagen behalten ihn (Reiter Einbindung, „Bestehende Anlagen“)."
K19 = "<b>Gäste:</b> im Reiter Einstellungen eine Rufnummer mit „gültig bis“ und den erlaubten Befehlen eintragen – höchstens 30 Tage; danach erlischt die Freigabe von selbst."
K20 = "<b>Haus-Werte im Chat:</b> mit dem Haken „Werte anderer Plugins im Chat abfragen“ beantwortet der Bot <span class='sm-mono'>status strom</span>, <span class='sm-mono'>status speicher</span>, <span class='sm-mono'>status kalender</span> … aus den Haus-Themen der anderen Plugins; ein gemeldeter Zustand gleichen Namens gewinnt."
K21 = "<b>Zwei Wege zum Bot:</b> A – eigene Nummer, Bot als verknüpftes Gerät: Befehle im Chat <i>Notiz an mich</i> (eigene Nummer unter den erlaubten Absendern, Haken ab Werk an); nur der Kontoinhaber chattet. B – eigene Nummer für den Bot (zweite SIM, Festnetz/VoIP): registrieren statt verknüpfen, dann chatten alle erlaubten Absender normal. Anleitung im Reiter Einstellungen, Abschnitt Verbindung."
