; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "This plugin turns <b>Signal</b> into a remote control for the house: commands sent by chat to the Miniserver, messages from Loxone back into the chat. Both directions."
K02 = "<b>Order of setup:</b>"
K03 = "<i>Settings</i> → <b>Start linking</b>. Scan the QR code on your phone under Signal → Settings → Linked devices. The bot attaches itself to your own account as a secondary device; a second phone number is not needed."
K04 = "Enter the <b>permitted senders</b> — one phone number per line. Anyone not on that list gets no reply."
K05 = "Set a <b>PIN</b> if you plan to use critical commands."
K06 = "<i>Commands</i> → fill in the table. Per line: the word, the MQTT topic and the level."
K07 = "<i>MQTT</i> → the house standard is <b>MQTT&#8209;gateway&nbsp;V2</b>: set one tick per topic there (list “MQTT gateway V2: tick these data points” in tab MQTT, sign of life and chat commands on <i>Noncached</i>). Under gateway V1 the plugin enters its subscription itself. A fixed command sends a pulse (value, after 1 s 0). Commands go directly to the MQTT broker of the LoxBerry (QoS&nbsp;1); if it confirms receipt, the bot replies “handed over to Loxone, confirmed by the MQTT broker”. Whether a command arrives at the Miniserver only Loxone shows."
K08 = "<i>Loxone integration</i> → step by step: point virtual inputs at the topics, create both templates and rebuild the two pages from the sample project in step 8 (monitoring and security, commands and messages) including pictures and instructions."
K09 = "<i>Test</i> → look at the self-check and run a command as a dry run."
K10 = "<b>About the levels:</b> <i>Immediate</i> executes without asking. <i>Confirm</i> makes the bot ask back. <i>PIN</i> additionally requires the PIN. For the alarm system and the front door, use the <i>PIN</i> level."
K11 = "<b>If nothing arrives:</b> The <i>Test</i> tab walks the chain from the bottom up — is signal-cli installed, is Java recent enough, does the native library match the architecture, is the service running, does the interface answer, is an account linked, is the bot listening. The first failed entry is usually the cause."
K12 = "<b>On the Raspberry Pi:</b> signal-cli ships its native library for x86_64 only. On ARM it has to be obtained separately, or signal-cli runs in a Docker image with ARM support and the plugin merely points at its address."
K13 = "signal-cli documentation: <a href='https://github.com/AsamK/signal-cli/wiki' target='_blank'>signal-cli wiki</a>"
K14 = "<b>Kill switch:</b> If a phone goes missing, the button in tab Settings locks the bot immediately - it then accepts no more commands. From Loxone <span class='sm-mono'>publish signalbot/befehl/sperren 1</span> locks via the MQTT gateway; unlocking from Loxone only with the second tick “Allow unlocking from Loxone” (tab MQTT, off by default)."
K15 = "<b>Urgent messages</b> are sent by Loxone as <span class='sm-mono'>publish signalbot/befehl/dringend &lt;text&gt;</span> (existing installations via the HTTP endpoint with <span class='sm-mono'>&amp;dringend=1</span>). They go out immediately even during quiet hours and are repeated until the recipient writes <span class='sm-mono'>quittiert</span>."
K16 = "<b>Who may do what:</b> The allow list says who may talk to the bot at all. The command table says per row who may trigger that particular command and whether a second person has to approve."
K17 = "<b>New in 0.9.30 – status via MQTT&#8209;gateway&nbsp;V2:</b> the bot sends <span class='sm-mono'>status/zaehler</span> and <span class='sm-mono'>status/ok</span> (messages arrive) every minute, plus account, allow list, commands, lock, rejections on change. Names of the virtual inputs in tab Integration, step 4."
K18 = "<b>Messages from Loxone via the command bridge:</b> <span class='sm-mono'>publish signalbot/befehl/senden &lt;text&gt;</span> to the UDP input of the gateway – without a token. Tick “Accept commands via MQTT” in tab MQTT (off by default). The HTTP endpoint is off on a new installation; existing installations keep it (tab Integration, “Existing installations”)."
K19 = "<b>Guests:</b> in tab Settings enter a phone number with “valid until” and the allowed commands – at most 30 days; afterwards the permission expires by itself."
K20 = "<b>House values in the chat:</b> with the tick “Query values of other plugins in the chat” the bot answers <span class='sm-mono'>status strom</span>, <span class='sm-mono'>status speicher</span>, <span class='sm-mono'>status kalender</span> … from the house topics of the other plugins; a reported state of the same name wins."
K21 = "<b>Two ways to reach the bot:</b> A – your own number, bot as a linked device: commands in the <i>Note to Self</i> chat (own number among the allowed senders, option on by default); only the account holder chats. B – a number of its own for the bot (second SIM, landline/VoIP): register instead of link, then all allowed senders chat normally. Instructions in the Settings tab, section Connection."
