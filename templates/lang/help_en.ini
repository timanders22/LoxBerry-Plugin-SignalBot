; Help texts, english. Belongs to templates/help/help.html.
; LBWeb::gethelp() derives the name of this file from the name of the help
; file and looks for it in templates/lang/ - not next to the help file.
; Every value is wrapped in double quotes and contains none itself; markup
; stays raw, the help text is not output escaped.

[HILFE]
K01 = "This plugin turns <b>Signal</b> into a remote control for the house: commands sent by chat to the Miniserver, messages from Loxone back into the chat. Both directions."
K02 = "<b>Order of setup:</b>"
K03 = "<i>Settings</i> → <b>Start linking</b>. Scan the QR code on your phone under Signal → Settings → Linked devices. The bot attaches itself to your own account as a secondary device; a second phone number is not needed."
K04 = "Enter the <b>permitted senders</b> — one phone number per line. Anyone not on that list gets no reply."
K05 = "Set a <b>PIN</b> if you plan to use critical commands."
K06 = "<i>Commands</i> → fill in the table. Per line: the word, the MQTT topic and the level."
K07 = "<i>MQTT</i> → enter the subscription in the gateway. Without that entry nothing arrives at the Miniserver."
K08 = "<i>Loxone integration</i> → point virtual inputs at the topics and copy the address used for messages."
K09 = "<i>Test</i> → look at the self-check and run a command as a dry run."
K10 = "<b>About the levels:</b> <i>Immediate</i> executes without asking. <i>Confirm</i> makes the bot ask back. <i>PIN</i> additionally requires the PIN. For the alarm system and the front door, use the <i>PIN</i> level."
K11 = "<b>If nothing arrives:</b> The <i>Test</i> tab walks the chain from the bottom up — is signal-cli installed, is Java recent enough, does the native library match the architecture, is the service running, does the interface answer, is an account linked, is the bot listening. The first failed entry is usually the cause."
K12 = "<b>On the Raspberry Pi:</b> signal-cli ships its native library for x86_64 only. On ARM it has to be obtained separately, or signal-cli runs in a Docker image with ARM support and the plugin merely points at its address."
K13 = "signal-cli documentation: <a href='https://github.com/AsamK/signal-cli/wiki' target='_blank'>signal-cli wiki</a>"
