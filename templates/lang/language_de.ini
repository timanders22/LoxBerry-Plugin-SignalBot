RICHTUNGEN_TEXT = "Dieses Plugin arbeitet in beide Richtungen. <b>Vom Chat nach Loxone</b> läuft über MQTT: ein Befehl wird zum Impuls auf einem Thema. <b>Von Loxone in den Chat</b> läuft über den Endpunkt: der Miniserver ruft eine Adresse auf, der Bot schickt die Nachricht."
S0 = "Vom Chat nach Loxone läuft alles über <b>MQTT</b>. Das ist der Regelweg: das Gateway erzeugt die Namen der virtuellen Eingänge selbst, in Loxone genügt ein passend benannter Eingang. UDP wäre die Rückfallebene und verlangt je Wert eine eigene Befehlserkennung - dieses Plugin braucht sie nicht. Das MQTT-Gateway ist seit LoxBerry 3 <b>Bestandteil des Systems</b> und wird unter System &rarr; MQTT Gateway eingeschaltet; es ist kein Plugin und muss nicht nachinstalliert werden. Von Loxone in den Chat läuft es umgekehrt über den Endpunkt, den ein virtueller Ausgang aufruft."
S0_T = "Schritt 1: Den Weg festlegen"
S1 = "Je Befehl ein virtueller Eingang, der auf dem Thema aus der Befehlstabelle hängt:"
S1_IMPULS = "Der Bot sendet <b>einen Impuls</b>, keinen Dauerwert. In Loxone gehört dahinter ein Impulsgeber oder eine Flanke — ein Schalter, der auf 1 stehen bleibt, würde nach einem Neustart des Gateways erneut auslösen."
S2 = "Ein virtueller Ausgang, der diese Adresse aufruft. Der Text wird angehängt und muss URL-kodiert sein:"
S2_BILD = "Mit <span class='sm-mono'>&amp;bild=</span> geht ein Bild mit - etwa der Kamera-Schnappschuss zum Alarm. Die Datei muss im Datenordner des Plugins oder unter /tmp liegen und lesbar sein:"
S2_DRINGEND = "<b>Dringend</b> mit <span class='sm-mono'>&amp;dringend=1</span>: die Meldung geht auch während der Nachtruhe sofort hinaus und wird wiederholt, bis jemand <span class='sm-mono'>quittiert</span> schreibt."
S2_HINWEIS = "Ohne <span class='sm-mono'>&amp;an=</span> geht die Meldung an <b>alle</b> erlaubten Absender. Mit <span class='sm-mono'>&amp;an=+49...</span> an genau einen — auch dieser muss auf der Weißliste stehen, sonst weist der Endpunkt ab. Ein <span class='sm-mono'>\n</span> im Text wird zum Zeilenumbruch."
S2_SPERRE = "<b>Kill-Schalter.</b> Diese beiden Adressen sperren den Bot und geben ihn wieder frei - gedacht für den Fall, dass ein Handy abhandenkommt:"
S2_T = "Von Loxone in den Chat: Meldungen senden"
S1_T = "Vom Chat nach Loxone: Befehle empfangen"
S3 = "Ein virtueller Ausgang je Zustand, ausgelöst bei Änderung:"
S3_HINWEIS = "Der Bot gibt alle gemeldeten Zustände auf das Wort <span class='sm-mono'>status</span> aus. Es werden höchstens 50 behalten, die ältesten fallen heraus."
S3_T = "Zustände melden, damit der Bot sie beantworten kann"
S4 = "Wer die Tabelle von oben nach unten abarbeitet, hat die Funktion nachgebaut. Die Bausteine findet man in Loxone Config über die Baustein-Suche (F5)."
S4_ERLAEUTERUNG = "<b>Zu #2:</b> Den Impuls aus #1 nicht direkt an den Alarmanlagen-Baustein hängen, sondern über einen Merker, der auch von der Tastatur im Flur gesetzt wird — sonst gibt es zwei Wege ins Scharfschalten, die nichts voneinander wissen.<br><b>Zu #5:</b> Die Schwelle deutlich über eine Minute legen. Der Bot wird vom Cron jede Minute nachgestartet; eine kürzere Schwelle meldet einen Ausfall, der keiner ist."
S4_T = "Komplette Baustein-Liste zum Nachbauen"
SABO = "Unter System &rarr; MQTT Gateway &rarr; Subscriptions genau diese Zeile eintragen:"
SABO_T = "Schritt 2: Abo im MQTT-Gateway eintragen"
SAUS = "<b>Ein virtueller Eingang behält seinen letzten Wert.</b> Fällt der Bot aus, sieht in der App deshalb alles normal aus - der Zustand steht nur still. Dagegen hilft das Lebenszeichen: der Bot schreibt jede Minute einen Zeitstempel auf"
SAUS_HINWEIS = "In Loxone einen analogen Eingang darauf legen und mit einer <b>Einschaltverzögerung von mindestens 180 Sekunden</b> auswerten. Die Schwelle muss deutlich über dem Takt liegen: der Bot wird vom Cron jede Minute nachgestartet, und eine einzelne verpasste Runde ist kein Ausfall. Dasselbe leistet <span class='sm-mono'>SIGNAL_OK</span> aus der Vorlage, wenn kein MQTT benutzt wird."
SAUS_T = "Schritt 7: Ausfallerkennung"
SGEGEN = "Ob die Adresse samt Token stimmt, lässt sich prüfen, <b>ohne dass etwas passiert</b>. Diese Adresse im Browser aufrufen - sie schaltet nichts und sendet nichts:"
SGEGEN_2 = "Die Antwort muss <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span> lauten. Kommt <span class='sm-mono'>OK=0</span> oder HTTP 403, stimmt das Token in der Adresse nicht mehr. Danach im MQTT-Gateway unter <i>Incoming overview</i> nachsehen, ob die Themen ankommen, und im Reiter <i>Test</i> einen Befehl trocken durchspielen."
SGEGEN_T = "Schritt 9: Gegenprobe"
SVI = "Diese Werte holt Loxone selbst beim Bot ab - ein virtueller HTTP-Eingang mit den folgenden Befehlserkennungen. Die fertige Importdatei erzeugt der Knopf weiter unten; die Tabelle bleibt trotzdem stehen, denn sie sagt, was importiert wird."
SVI_ADRESSE = "Adresse des Eingangs (Abholtakt 60 s):"
SVI_HOST = "<b>Den Rechnernamen prüfen.</b> Er stammt aus dem Aufruf dieser Seite und ist nur ein Vorschlag - maßgeblich ist, unter welchem Namen oder welcher Adresse der <i>Miniserver</i> den LoxBerry erreicht."
SVI_T = "Schritt 4: Virtuelle Eingänge für den Zustand des Bots"
