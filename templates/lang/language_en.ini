WAS_IST_DAS = "<b>Local messenger bot for the Loxone Miniserver – via Signal.</b> Allowed senders send a plain-text command via Signal, such as “alarmanlage unscharf”; the bot checks the sender and the level of the command and passes it on to the Miniserver over MQTT. In the other direction, Loxone reports back into the same chat through the bot. For this, signal-cli attaches itself as a linked device to an existing Signal account; messages stay end-to-end encrypted, and no cloud service is involved."
FEHLER_HAUS_BEREICHE = "Areas for house values: only the offered words."
FEHLER_PIN_BEIDES = "Please either enter a new PIN or delete the stored one – not both."
FEHLER_PLUGINS = "Messages from other plugins: only folder names from a-z, 0-9 and _ (at most 50)."
H_HAUS = "House values in the chat"
H_HAUS_BEREICHE = "A reported state of the same name wins (<span class='sm-mono'>status strom</span> then shows the state “strom”). <span class='sm-mono'>status haus</span> shows all ticked areas. “zuhause” only says somebody/nobody – off by default."
H_HAUS_TEXT = "Reads the house topics of the other plugins via the MQTT broker of the LoxBerry (electricity price, storage, calendar, waste collection, UPS, departure, presence). Answers only allowed senders, never guests. If a plugin is silent for more than 2 minutes, the answer says “no statement”. A separate companion process keeps the connection; it writes nothing under haus/."
H_PLUGINS = "Messages from other plugins"
H_PLUGINS_TEXT = "Other plugins can send messages into the chat via the command bridge (<span class='sm-mono'>signalbot/befehl/plugin/&lt;folder&gt;</span>, plain text or JSON with text, dringend, bild). Accepted only from those ticked here; in the chat the folder name comes first. Target: the group or all allowed senders – never a single number. Only works with “Accept commands via MQTT” (tab MQTT). An image only from the data folder of the sending plugin."
L_HAUS = "Query values of other plugins in the chat (status strom, status speicher …)"
L_HAUS_BEREICHE = "Areas:"
L_PLUGINS = "Accept messages from other plugins"
PIN_NICHT_UEBERNOMMEN = "The PIN was not taken over – please enter it again."
PLUGINS_KEINE = "No other plugins found."
