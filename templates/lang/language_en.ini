P_ALLE = "all allowed"
P_ANTWORT = "empty = default text"
SPALTEN_TEXT = "<b>Value:</b> <i>fixed value</i> always sends the same payload. <i>number from sender</i> expects it in the message - <span class='sm-mono'>heizung 21</span> -, the two small fields below set the limits. <b>Who may:</b> empty means all allowed senders; otherwise only these numbers, separated by commas. <b>2nd approval:</b> this number is asked additionally and must answer <span class='sm-mono'>ja</span> before anything is switched."
STUFEN = "<b>The level decides.</b> <i>Immediate</i> runs without asking — right for lights and blinds. <i>Confirm</i> makes the bot ask <span class='sm-mono'>Really? yes/no</span> — right for anything you do not want to trigger by accident. <i>PIN</i> additionally demands the PIN from the settings — right for the alarm system and the front door. A pending confirmation expires after 90 seconds."
