ERKLAERUNG = "A command is a word the user writes plus an MQTT topic the bot then sends to: for a <i>fixed value</i> a pulse (the value, after one second 0), for a <i>number from sender</i> the number, which stays. Upper and lower case do not matter. What Loxone does with it is described on the <i>Loxone integration</i> tab."
