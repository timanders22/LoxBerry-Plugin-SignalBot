BESTEHEND_TEXT = "Up to 0.9.29 the integration ran via this HTTP endpoint with a token in every address. New installations do not need it: values come via MQTT gateway V2 (step 4), messages via the command bridge (step 5) – both without a token in the project file. An updated installation keeps it; a new installation has it off (calls then get HTTP 403 <span class='sm-mono'>ENDPUNKT_AUS</span>; only <span class='sm-mono'>?selftest=1</span> stays open)."
H_BESTEHEND = "Existing installations: HTTP endpoint"
H_ENDPUNKT = "Off = the whole endpoint for Loxone is locked (status line, senden, zustand, sperren, entsperren); only <span class='sm-mono'>?selftest=1</span> still checks the token. Off by default, on after an update."
K_KOPIEREN = "Copy"
