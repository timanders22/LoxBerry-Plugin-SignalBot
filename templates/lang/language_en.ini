SPALTEN_TEXT = "<b>Value:</b> <i>fixed value</i> sends a pulse - the value, after one second 0. A fixed value 0 therefore triggers nothing. <i>number from sender</i> expects it in the message - <span class='sm-mono'>heizung 21</span> -, the two small fields below set the limits (whole numbers); it stays. <b>Who may:</b> empty means all allowed senders; otherwise only these numbers, separated by commas. <b>2nd approval:</b> this number - it must be on the allow list - is asked additionally and must answer <span class='sm-mono'>ja</span> before anything is sent. An error in one row prevents saving the whole table."
