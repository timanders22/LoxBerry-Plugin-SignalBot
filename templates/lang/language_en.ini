ERKLAERUNG = "A command is a word the user writes plus an MQTT topic that then receives a pulse. Upper and lower case do not matter. What Loxone does with the pulse is described on the <i>Loxone integration</i> tab."
FEHLER_ABSENDER = "Row %2$d: %1$s is not a valid number for the responsibility list."
FEHLER_BEREICH = "Row %d: The maximum must be greater than the minimum."
