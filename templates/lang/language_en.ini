A_BOGEN_ARM = "Architecture %s. signal-cli ships its <span class='sm-mono'>libsignal</span> library for x86_64 machines only - on a Raspberry Pi it is missing. That is why the service does not start, the JSON-RPC interface does not answer, and no Signal account can be linked. The file has to be supplied once; after that everything runs by itself."
A_BOGEN_NATIV = "Architecture %s - and the supplied library <span class='sm-mono'>libsignal_jni.so</span> is in place (%s MB). The service finds it via LD_LIBRARY_PATH."
A_BOGEN_OK = "Architecture %s - the bundled native library fits."
A_BOGEN_ORT = "<b>The easy way:</b> press <i>Fetch the libsignal library</i> below. The plugin downloads the matching build (libsignal %1$s for %2$s), stores it in the right place under the right name; then press <i>Start service</i>. No command line and no administrator rights needed.<br><br><b>By hand, if the LoxBerry has no internet:</b><ol><li>On a PC open this page: <a href='%3$s' target='_blank' rel='noopener'>%3$s</a></li><li>Download the file <span class='sm-mono'>libsignal_jni.so-v%1$s-<b>aarch64</b>-unknown-linux-gnu.tar.gz</span> - <i>aarch64</i> is the name for %2$s. (On an older 32-bit Pi, architecture <i>armhf</i>, it is <span class='sm-mono'>armv7-unknown-linux-gnueabihf</span>.)</li><li>Unpack the archive on the PC - you get a single file <span class='sm-mono'>libsignal_jni.so</span>. Do <b>not</b> change the name.</li><li>Copy that file to the LoxBerry, into the folder <span class='sm-mono'>%4$s</span>. Easiest with WinSCP or FileZilla: protocol <i>SFTP</i>, host the address of your LoxBerry, user <span class='sm-mono'>loxberry</span>, then drag the downloaded file into that folder.</li><li>Back in this tab press <i>Start service</i>. This line must then show a tick.</li></ol><b>Where the file comes from:</b> It is a third-party build linked from the signal-cli wiki under <i>Provide native lib for libsignal</i> - not from the signal-cli developers themselves. The version must match the one inside signal-cli (%1$s), otherwise the service still will not start."
A_BOGEN_UNBEKANNT = "(version not detectable)"
