H_ABSICHERUNG = "Security"
H_AUDIT = "Records who triggered which command and when - separate from the operating log, which gets truncated. For a bot that can arm the alarm system this is not a luxury."
H_BREMSE = "More attempts within a minute are rejected. This mainly limits guessing a PIN."
H_ERLAUBT = "One phone number per line, in international format. Anyone not listed cannot command the bot."
H_GRUPPE = "Leave empty and every message goes to each allowed sender individually. With a group id it goes to the group once. The id appears in the output of <span class='sm-mono'>listGroups</span>."
H_HERZSCHLAG = "The bot writes a timestamp to the topic <span class='sm-mono'>online</span> every minute. Only this lets Loxone tell that the bot is alive - a virtual input otherwise just keeps its last value."
