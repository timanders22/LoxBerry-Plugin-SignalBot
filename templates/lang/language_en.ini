SPERRE_TEXT = "<b>For the case that a phone goes missing.</b> A locked bot accepts no commands and only answers <span class='sm-mono'>hilfe</span>. Messages from Loxone still go out. The bot can also be locked from the Miniserver - see tab <i>Loxone integration</i>."
