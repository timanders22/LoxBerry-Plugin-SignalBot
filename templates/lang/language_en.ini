S3_HTTP = "Report a state via the endpoint:"
SBEFEHLE = "A virtual output at the existing output “LoxBerry MQTT-Gateway” (UDP input of the gateway) with commands of the form <span class='sm-mono'>publish signalbot/befehl/&lt;name&gt; &lt;text&gt;</span>. The command bridge accepts them when “Accept commands via MQTT” is ticked in tab MQTT (off by default), queues the message, and the bot delivers it within about 10 s – no token in the project file. The answer is under <span class='sm-mono'>…/quittung</span>:"
SBEFEHLE_AUSGANG = "Address of an own output (like the existing output “LoxBerry MQTT-Gateway”): %s"
SBEFEHLE_FORM = "<b>Never “retain”.</b> Text at most 4000 bytes, cut to 2000 characters like the endpoint; line break only as <span class='sm-mono'>\n</span> (backslash and n – a real line break becomes a space); umlauts pass as UTF-8. Recipient and state name are in the topic, never in the text: <span class='sm-mono'>senden/49…</span> = only to this number of the allow list (digits without +). The same text within 60 s goes out only once; <span class='sm-mono'>sperren</span> and <span class='sm-mono'>zustand</span> always work. At most 20 messages per minute."
SBEFEHLE_HAKEN = "<b>entsperren</b> only works with the second tick “Allow unlocking from Loxone” (tab MQTT, off by default): any device in the home network can send via the MQTT gateway – only who allowed it here shall be able to release the kill switch."
SBEFEHLE_PLUGINS = "<b>Messages from other plugins</b> (since 0.9.30): a plugin sends <span class='sm-mono'>publish signalbot/befehl/plugin/&lt;folder&gt; &lt;text&gt;</span> or JSON <span class='sm-mono'>{&quot;text&quot;: …, &quot;dringend&quot;: 1, &quot;bild&quot;: &quot;…/data/plugins/&lt;folder&gt;/bild.jpg&quot;}</span>. Accepted only from the plugins ticked in tab Settings; a door opener remains a chat command with level PIN."
SBEFEHLE_T = "Step 5: From Loxone into the chat: messages via the command bridge"
