RICHTUNGEN_TEXT = "This plugin works in both directions – since 0.9.30 both via <b>MQTT gateway V2</b>, without a token in the project file. <b>From the chat to Loxone</b>: a command becomes a pulse on a topic. <b>From Loxone into the chat</b>: a command to the UDP input of the gateway, the command bridge queues the message, the bot sends it. Gateway V2 delivers the state of the bot as virtual inputs."
S0 = "Both directions run via <b>MQTT gateway V2</b>, <b>part of the system</b> since LoxBerry 3 (System → MQTT Gateway; not a plugin). Gateway V2 creates the names of the virtual inputs itself and subscribes to exactly the topics ticked in its list (opt-in per topic). Messages from Loxone go as a <span class='sm-mono'>publish</span> command to its UDP input. The HTTP endpoint with token remains only for existing installations (below, collapsed)."
S0_T = "Step 1: Choose the path"
S1 = "One virtual input per command, listening on the topic from the command table:"
S1_IMPULS = "A <b>fixed</b> command sends a real pulse: the value, after one second 0 - so a second identical command also arrives as a new edge. In Loxone it needs an input that reacts to the rising edge. A command with a <b>number</b> sends the number and leaves it standing (a set point). In MQTT gateway V2 tick every command topic and set it to <i>Noncached</i> – otherwise a second identical “heizung 21” would not arrive."
S2 = "A virtual output calling this address. The text is appended and must be URL encoded:"
S2_BILD = "With <span class='sm-mono'>&amp;bild=</span> an image is attached - for example the camera snapshot for an alarm. Only an image (jpg, jpeg, png, gif, webp) inside the plugin data folder or below is accepted; <span class='sm-mono'>/tmp</span> and other folders are rejected:"
S2_DRINGEND = "<b>Urgent</b> with <span class='sm-mono'>&amp;dringend=1</span>: the message goes out immediately even during quiet hours and is repeated until somebody replies <span class='sm-mono'>quittiert</span>."
S2_HINWEIS = "Without <span class='sm-mono'>&amp;an=</span> the message goes to <b>all</b> allowed senders. With <span class='sm-mono'>&amp;an=+44...</span> to exactly one — who must also be on the allow list, otherwise the endpoint rejects it. A <span class='sm-mono'>\n</span> in the text becomes a line break."
S2_SPERRE = "<b>Kill switch.</b> These two addresses lock the bot and release it again - meant for the case that a phone goes missing:"
S2_T = "HTTP: messages, states and kill switch via the endpoint"
S1_T = "Step 3: From the chat to Loxone: receiving commands"
S3 = "One output command per state at the output “LoxBerry MQTT-Gateway”, triggered on change (command on analogue value, never retain):"
S3_HINWEIS = "The bot lists all reported states on the word <span class='sm-mono'>status</span>. At most 50 are kept, the oldest drop out. The name stands in lower case in the topic (a-z, 0-9, _); a name with capitals or a hyphen is discarded by the command bridge without an acknowledgement."
S3_T = "Step 6: Reporting states so the bot can answer them"
S4 = "Two pages from the LoxBerry plugins sample project, built and connected there in Loxone Config: <b>“SignalBot”</b> monitors bot and security, <b>“SignalBot Befehle und Meldungen”</b> shows both directions with examples. If you only want monitoring, take over the first page. Per page: instructions, table (work through it from top to bottom), notes and picture. The blocks are found in Loxone Config via the block search (F5)."
S4_T = "Step 8: Block lists to rebuild"
SABO = "The topic group of this plugin is:"
SABO_T = "Step 2: The ticks in MQTT gateway V2"
SAUS = "<b>A virtual input keeps its last value.</b> If the bot fails, everything looks normal in the app – the state just stands still. Therefore the bot sends a sign of life via MQTT gateway V2 every minute: <span class='sm-mono'>status/zaehler</span> counts up while LoxBerry, gateway and bot run, and <span class='sm-mono'>status/ok</span> says whether messages arrive (the event stream of signal-cli is usable). The sample project detects the failure with a Value Validator on the counter (step 8, page “SignalBot”, no. 11 to 17). Gateway name of the counter:"
SAUS_HINWEIS = "The counter is never retained and needs the tick with <i>Noncached</i> in gateway V2. The old sign of life <span class='sm-mono'>online</span> (Unix time) continues for one more version, but is deprecated."
SAUS_T = "Step 7: Failure detection"
SGEGEN = "In the MQTT gateway under <i>Incoming overview</i> check that <span class='sm-mono'>signalbot/status/zaehler</span> arrives every minute. In tab <i>Test</i> the row “MQTT gateway V2” shows whether the ticks are set, and “Command bridge” what came from Loxone last. The push button “Taste Testmeldung (SignalBot)” tests the whole path up to the phone; the answer of the bridge is under <span class='sm-mono'>signalbot/befehl/senden/quittung</span>. Do a dry run of a chat command in tab Test."
SGEGEN_2 = "The answer must be <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span>. If <span class='sm-mono'>OK=0</span> or HTTP 403 comes back, the token in the address is no longer correct. After that check under <i>Incoming overview</i> in the MQTT gateway whether the topics arrive, and dry-run a command in the <i>Test</i> tab."
SGEGEN_T = "Step 9: Verification"
SVI = "Loxone fetches these values from the bot itself - one virtual HTTP input with the command recognitions below. The button further down creates the ready-made import file; the table stays anyway, because it explains what is being imported."
SVI_ADRESSE = "Address of the input (polling time 60 s):"
SVI_HOST = "<b>Check the host name.</b> It comes from the call to this page and is only a suggestion - what counts is the name or address under which the <i>Miniserver</i> reaches the LoxBerry."
SVI_T = "HTTP: virtual inputs for the state of the bot (status line)"
