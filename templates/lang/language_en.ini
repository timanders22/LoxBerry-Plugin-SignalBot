SICH_PIN_GEHASHT = "The PIN was in plain text in the backup – it is now stored as a hash."
SICH_PIN_ENTFERNT = "PIN removed (backup without PIN)."
H_WEGE = "Two ways to reach the bot"
WEG_A_TEXT = "<b>Way A – your own number, bot as a linked device</b> (linked as above): the bot writes under your number. You send commands in the <i>Note to Self</i> chat; the bot replies there. Only you as the account holder can chat with it this way – other allowed senders cannot reach it, they only receive messages."
WEG_B_TEXT = "<b>Way B – a number of its own for the bot</b> (second SIM, landline or VoIP number verified by voice call): the bot is <b>registered instead of linked</b> with that number. Then all allowed senders (family too) simply write to the bot like to any contact."
WEG_AKTIV = "Currently active:"
WEG_IST_A = "Way A – the bot is linked to your own number as a device; commands via <i>Note to Self</i>."
WEG_IST_B = "Way B – the bot has a registered number of its own; all allowed senders chat normally."
WEG_IST_KEINS = "none yet – no account is set."
WEG_IST_UNBEKANNT = "cannot be determined (signal-cli does not answer or does not report the devices). After the first evaluated <i>Note to Self</i> this shows way A."
L_NOTIZ = "“Note to Self” as command channel (way A)"
H_NOTIZ = "Recommended and on by default. Only works if your own number (the account) is among the allowed senders. A message in <i>Note to Self</i> then counts as a message from you: same commands, PIN levels, rate limit; the event log shows “(Notiz an mich)”. The bot never evaluates its own replies and messages, nor messages to other chats or groups."
NOTIZ_NICHT_ERLAUBT = "Your own number is not among the allowed senders – <i>Note to Self</i> has no effect. Add it below under “Allowed senders”."
WECHSEL_TITEL = "How to: switch from way A to way B"
WECHSEL_1 = "Get the number ready: second SIM, landline or VoIP number that can receive a call. It must not already be signed in to another Signal app."
WECHSEL_2 = "Solve the captcha in your own browser: open <span class='sm-mono'>https://signalcaptchas.org/registration/generate.html</span>, solve it, then copy the “Open Signal” link with a right click (it starts with <span class='sm-mono'>signalcaptcha://</span>). You solve the captcha yourself – the plugin does not."
WECHSEL_3 = "Register on the LoxBerry (SSH as <span class='sm-mono'>loxberry</span>) – insert number and captcha link. For landline/VoIP first like this, after 60 seconds run the same command again with <span class='sm-mono'>&quot;voice&quot;:true</span>:"
WECHSEL_4 = "Enter the code from the SMS or call (with registration lock also <span class='sm-mono'>&quot;pin&quot;</span>):"
WECHSEL_5 = "Above, use “Unlink” (the old link to your number) and remove “LoxBerry Signal Bot” on the phone under <i>Linked devices</i>."
WECHSEL_6 = "Enter the new number in the “Linked account” field, save and check the Test tab. Then save the bot as a contact on your phone and write to it."
WECHSEL_BLEIBT = "Allowed senders, commands, PIN and guests are kept when switching. Your own number can stay allowed – then you write to the bot from your phone like everyone else; <i>Note to Self</i> has no effect in way B. Back to way A: unlink and link again."

[BEF]
EINGEBAUT_TEXT = "The bot always knows these words and they cannot be used as a command: <span class='sm-mono'>hilfe</span>, <span class='sm-mono'>help</span> and <span class='sm-mono'>?</span> list all enabled commands, <span class='sm-mono'>status</span> and <span class='sm-mono'>zustand</span> (also followed by a name) the reported states, <span class='sm-mono'>ja</span>, <span class='sm-mono'>nein</span>, <span class='sm-mono'>yes</span>, <span class='sm-mono'>no</span>, <span class='sm-mono'>ok</span>, <span class='sm-mono'>abbrechen</span> and <span class='sm-mono'>stop</span> answer a confirmation, <span class='sm-mono'>quittiert</span>, <span class='sm-mono'>quittieren</span> and <span class='sm-mono'>ack</span> acknowledge an urgent message."
ERKLAERUNG = "A command is a word the user writes plus an MQTT topic the bot then sends to: for a <i>fixed value</i> a pulse (the value, after one second 0), for a <i>number from sender</i> the number, which stays. Upper and lower case do not matter. What Loxone does with it is described on the <i>Loxone integration</i> tab."
