[BAUSTEIN]
SCHRITTE_TITEL = "How to take over this page"
HINWEISE_TITEL = "Notes"
S1_SCHRITT1 = "In the plugin tab “%s” link the Signal account: “%s”, scan the QR code on the phone under Signal → Settings → Linked devices, then “%s”. Under “%s” enter one phone number per line (international) and set a PIN. Tab “%s”: the self-check is green, “%s” arrives on the phone."
S1_SCHRITT2 = "Tab “%s”: switch MQTT on, then on the LoxBerry under System → MQTT Gateway → Subscriptions tick the data points of the list “MQTT gateway V2: tick these data points”; signalbot_status_zaehler and signalbot_status_ok additionally to “Noncached”. Tab “%s”, step 4: the names of the virtual inputs (copy button)."
S1_SCHRITT3 = "Create the page “SignalBot” and the virtual inputs no. 1–10 (Periphery → Virtual Inputs → Virtual Input): name EXACTLY the gateway name, do NOT tick “Use as digital input”, Min/Max as in the list. The LoxBerry user needs rights on these inputs. Plus the constant 1 (no. 11, block search F5, value 1)."
S1_SCHRITT4 = "Create two notifications (Periphery → Messages → Notification): “Meldung Plugin gestört (SignalBot)” and “Meldung Sicherheit (SignalBot)”, texts as in the list. Each gets exactly one connection."
S1_SCHRITT5 = "Place the remaining blocks via the block search (key F5), parameters as in the list, connect from top to bottom. On the Value Validator no. 12 remove the tick at ‘En’ in the properties window (Config creates En inverted; otherwise constant 1 arrives as 0). Status “Zustand (SignalBot)”: click “+” four times first (V5–V8); enter the rows in the given order, the one without condition last."
S1_SCHRITT6 = "Save and transfer to the Miniserver. Check: “Zustand (SignalBot)” shows “läuft – … erlaubte Absender, … Befehle”; signalbot_status_zaehler counts up by one every minute."
S1_H1 = "The fault message only comes after 10 minutes; “sign of life missing” (LoxBerry, MQTT gateway or bot stands still) after 5 minutes without a new counter value. A restart of the bot or an update reports nothing."
S1_H2 = "On no. 2 and 12: signalbot_status_zaehler is the sign of life (+1 every minute). If the LoxBerry stands still, the value stays – only the Value Validator notices that. After a restart of the Miniserver the inputs stay at 0 until the first value (counter within 60 s) – no false alarm."
S1_H3 = "If signal-cli runs in a Docker container (the way for the Raspberry Pi), signalbot_daemon shows -1 (no own service) – that is correct then."
S1_H4 = "On no. 18 to 21: rejected messages and wrong PINs come on change; the Switch-On Delay no. 21 swallows a peak that falls again within two minutes."
S1_H5 = "The security warning only counts with “%s” (tab “%s”, on by default). It does not lock the bot itself – a human decides that with the switch “Bot sperren (SignalBot)” on the second page."
S2_SCHRITT1 = "In the plugin tab “%s” enter and switch on four rows: “licht an”, topic licht/wohnen, fixed value 1, level immediately; “rollo zu”, topic rollo/zu, fixed value 1, level confirmation; “alarm unscharf”, topic alarm/unscharf, fixed value 1, level PIN; “heizung”, topic heizung/soll, number from the sender 15 to 25, level confirmation. On the LoxBerry under System → MQTT Gateway the gateway must be running; the plugin enters the subscription signalbot/# itself."
S2_SCHRITT2 = "Create the four virtual inputs (Periphery → Virtual Inputs → Virtual Input). The name must be EXACTLY the gateway name: signalbot_licht_wohnen, signalbot_rollo_zu, signalbot_alarm_unscharf, signalbot_heizung_soll (prefix and topic with “_” instead of “/”). Set the readable name only as display name – whoever changes the name gets a second, empty input. No. 4 as “Analog”. In MQTT gateway V2 tick each of these topics and set it to “Noncached”."
S2_SCHRITT3 = "Tab “%s”: tick “%s” and save. Create the six output commands (no. 8, 12, 14, 16, 17, 19) at the existing output “LoxBerry MQTT-Gateway”, command on ON (and on OFF) as in the list – or in tab “%s” import the “%s” (own output “SignalBot MQTT-Befehle”, only ONCE)."
S2_SCHRITT4 = "Create the page “SignalBot Befehle und Meldungen”. Create or drag the virtual inputs signalbot_letzter_min, signalbot_gesperrt (further instance), signalbot_offen and signalbot_zustaende (name EXACTLY the gateway name), the six output commands, plus “Türklingel (eigene Quelle)” and “Niemand zu Hause (eigene Quelle)” from the tree (or your own doorbell and presence)."
S2_SCHRITT5 = "Create new: the push button “Taste Testmeldung (SignalBot)”, the switches “Bot sperren (SignalBot)”, “Alarm ausgelöst (eigene Quelle)” and “Alarmanlage scharf (eigene Quelle)” (in your own project replace them by the outputs of your own burglar alarm) and the notification “Meldung unquittiert (SignalBot)”."
S2_SCHRITT6 = "Place the remaining blocks via the block search (key F5), parameters as in the list, connect as in the list. Save and transfer to the Miniserver."
S2_SCHRITT7 = "Check: press “Taste Testmeldung (SignalBot)” in the app – the phone receives “Meldung aus Loxone” within about 10 s. Write “licht an” in the chat – the bot answers that the command was handed over to Loxone and confirmed by the MQTT broker, and “Befehle aus dem Chat (SignalBot)” shows the last command. “heizung 21” and “ja” on the confirmation question – Loxone additionally sends “Wert: 21”."
S2_H1 = "Each output command may appear only ONCE in the project. If a second source is to trigger the same message, put an OR in front of both."
S2_H2 = "Own texts: create further output commands at the output “LoxBerry MQTT-Gateway”, command on ON “publish signalbot/befehl/senden &lt;text&gt;” (line break as \n, never retain). To one person only: senden/&lt;phone number without +&gt; – it must be allowed."
S2_H3 = "Fixed commands are pulses (1, after 1 s 0) – connect them to push-button inputs. Do not switch the alarm directly but via a flag that the keypad in the hallway also sets – otherwise there are two paths into arming and disarming that know nothing of each other."
S2_H4 = "On no. 18 and 19: “Bot sperren” is a switch, not a push button – command on ON locks, on OFF it unlocks; unlocking only works with “Allow unlocking from Loxone” in the plugin (off by default). If the bot is unlocked in the plugin, “Meldungen (SignalBot)” says so."
S2_H5 = "On no. 17: “Meldung mit Wert” sends on every change of the value – only use rarely changing values. The confirmation goes to all allowed senders, not only to the one who wrote the command. The same value within 60 s goes out only once."
S2_H6 = "On no. 23 and 24: open messages come on change; the Switch-On Delay no. 24 only reports when an urgent message stays unacknowledged for 10 minutes."
S2_H7 = "Quiet hours (tab “%s”, off by default): ordinary messages wait until the morning, the urgent alarm message goes out immediately. The bot only accepts the state no. 16 while the tick for states is set there (on by default)."
S2_H8 = "In your own house choose only one doorbell path – either the doorbell messages in the Intercom plugin or these blocks; otherwise every ring arrives twice."
Z1_01 = "Virtual input (name as the MQTT gateway assigns it, plugin SignalBot) | signalbot_status_ok | 1 = messages arrive (the event stream of signal-cli is usable), 0 = not; comes every minute with the sign of life; version 2: tick and “Noncached” | —"
Z1_02 = "Virtual input (name as the MQTT gateway assigns it, plugin SignalBot) | signalbot_status_zaehler | sign of life of the bot: counts up by one every minute, 0 to 999, wraps around – even if nothing else changes; never retained; version 2: tick and “Noncached” | —"
Z1_03 = "Virtual input (name as the MQTT gateway assigns it, plugin SignalBot) | signalbot_daemon | 1 = the signal-cli service on the LoxBerry is running, 0 = not, -1 = no own service (signal-cli in a Docker container or on another computer); version 2: tick | —"
Z1_04 = "Virtual input (name as the MQTT gateway assigns it, plugin SignalBot) | signalbot_rpc | 1 = signal-cli answers the bot, 0 = not (checked every minute); version 2: tick | —"
Z1_05 = "Virtual input (name as the MQTT gateway assigns it, plugin SignalBot) | signalbot_konto | 1 = a Signal account is linked; version 2: tick | —"
Z1_06 = "Virtual input (name as the MQTT gateway assigns it, plugin SignalBot) | signalbot_erlaubte | number of allowed senders (without guests); version 2: tick | —"
Z1_07 = "Virtual input (name as the MQTT gateway assigns it, plugin SignalBot) | signalbot_befehle | number of enabled commands; version 2: tick | —"
Z1_08 = "Virtual input (name as the MQTT gateway assigns it, plugin SignalBot) | signalbot_gesperrt | 1 = bot locked (kill switch), accepts no commands (further instance on page “SignalBot Befehle und Meldungen”); version 2: tick | —"
Z1_09 = "Virtual input (name as the MQTT gateway assigns it, plugin SignalBot) | signalbot_abgewiesen | rejected messages in the last hour (unknown senders, too many commands, not responsible, expired guests); version 2: tick | —"
Z1_10 = "Virtual input (name as the MQTT gateway assigns it, plugin SignalBot) | signalbot_pinfehl | wrong PIN entries in the last hour; version 2: tick | —"
Z1_11 = "Constant | Konstante 1 | value 1 | —"
Z1_12 = "Value Validator | Lebenszeichen fehlt (SignalBot) | Tmc 300 s (five minute cycles without a new sign of life), Min 0, Max 999 – if the LoxBerry, the MQTT gateway or the bot stands still, or MQTT is off in the plugin, the counter stops; remove the tick at ‘En’ in the properties window | V = #2, En = #11"
Z1_13 = "NOT | Keine frischen Daten (SignalBot) | — (no messages arrive: event stream unusable or signal-cli does not answer) | I = #1"
Z1_14 = "OR | Störung (SignalBot) | — (no fresh data or sign of life missing) | I1 = #13, I2 = output E of #12"
Z1_15 = "Switch-On Delay | Störung bestätigt (SignalBot) | 600 s (ten minute cycles; a restart and a single lost sign of life report nothing) | Input = #14"
Z1_16 = "Notification | Meldung Plugin gestört (SignalBot) | Text: Signal Bot – no commands via chat possible for 10 minutes: the bot or signal-cli is not running, no messages arrive, or LoxBerry or MQTT gateway do not answer. Read the status “Zustand (SignalBot)” in the app | Input = #15"
Z1_17 = "Status | Zustand (SignalBot) | rows: V1 = 1 “no sign of life for 5 minutes – LoxBerry, MQTT gateway (version 1: subscription signalbot/#, version 2: tick at signalbot_status_zaehler) or the bot stands still; check ‘Values via MQTT’ in plugin tab MQTT and tab Test”; V8 = 1 “locked (kill switch) – accepts no commands; unlock in the plugin or on page ‘SignalBot Befehle und Meldungen’ (there only with ‘Allow unlocking from Loxone’ in the plugin)”; V5 = 0 “no Signal account linked – in the plugin tab Settings ‘Start linking’, scan the QR code on the phone under ‘Linked devices’, then ‘Finish linking’”; V4 = 0 “signal-cli does not answer (service running: <v3>; -1 = no own service) – in the plugin tab Test ‘Start service’; on the Raspberry Pi first ‘Fetch library libsignal’; signal-cli in a Docker container: check there”; V2 = 0 “signal-cli answers, but no messages arrive (event stream closes immediately – account not completely linked or signal-cli is starting); check the plugin tab Log files”; V6 = 0 “no allowed senders – enter phone numbers in the plugin tab Settings”; V7 = 0 “running – but no command enabled yet (plugin tab Commands)”; without condition “running – <v6> allowed senders, <v7> commands”; visualisation ON | V1 = output E of #12, V2 = #1, V3 = #3, V4 = #4, V5 = #5, V6 = #6, V7 = #7, V8 = #8"
Z1_18 = "Threshold Switch | Viele abgewiesene Nachrichten (SignalBot) | On 4.5 / Off 0.5 (from 5 rejected messages in one hour; count value, not a 0/1 field) | Input = #9"
Z1_19 = "Threshold Switch | Falsche PIN (SignalBot) | On 2.5 / Off 0.5 (from 3 wrong PIN entries in one hour) | Input = #10"
Z1_20 = "OR | Sicherheitswarnung (SignalBot) | — | I1 = #18, I2 = #19"
Z1_21 = "Switch-On Delay | Sicherheitswarnung bestätigt (SignalBot) | 120 s (a peak that falls again within two minutes reports nothing) | Input = #20"
Z1_22 = "Notification | Meldung Sicherheit (SignalBot) | Text: Signal Bot – several wrong PIN entries or rejected messages in the last hour. Is a phone lost? Then switch on the switch “Bot sperren (SignalBot)” and read the event log in the plugin tab Log files | Input = #21"
Z1_23 = "Status | Sicherheit (SignalBot) | rows: V4 = 1 “locked – the bot accepts no commands (last hour: <v2> wrong PINs, <v1> rejected messages)”; V3 = 1 “Attention: <v2> wrong PINs and <v1> rejected messages in the last hour – phone lost? Lock the bot”; V2 > 0 “<v2> wrong PIN entries in the last hour”; V1 > 0 “<v1> rejected messages in the last hour (strangers, too many commands or not responsible)”; without condition “quiet – no rejected messages and no wrong PINs in the last hour”; visualisation ON | V1 = #9, V2 = #10, V3 = #21, V4 = #8"
