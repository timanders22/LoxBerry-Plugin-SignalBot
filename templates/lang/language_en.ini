[EINST]
ABSICHERUNG_TEXT = "<b>This is where it is decided who can unlock the house.</b> A bot allowed to disarm the alarm is a key — and it lives in a chat on a phone that can be lost. Three layers act independently: the allow list below, the level per command on the <i>Commands</i> tab, and the rate limit against guessing."
FEHLER_BEREICH = "%s: the value must be between %d and %d."
FEHLER_GRUPPE = "The group id does not look like one from signal-cli. It appears in the output of listGroups."
FEHLER_KONTO = "The account number must be in international format, with + and country code."
FEHLER_NACHT = "Quiet hours need two different times in the form 22:00 and 07:00 - or both fields empty."
FEHLER_NUMMER = "These entries are not valid phone numbers: %s. The international format is expected, for example <span class='sm-mono'>+441234567890</span>."
FEHLER_SPEICHERN = "The configuration could not be written: %s"
FEHLER_TOPIC = "The MQTT topic (prefix) may contain only letters, digits, _ . - and the slash between two levels, at most 64 characters, no slash at either end."
FEHLER_URL = "The address consists of http:// or https://, host and optionally port - <b>without a path</b>, for example <span class='sm-mono'>http://127.0.0.1:8095</span>. The plugin appends the path /api/v1/... itself."
GESPEICHERT = "Settings saved."
H_ABSICHERUNG = "Security"
H_AUDIT = "Records who triggered which command and when - separate from the operating log, which gets truncated. For a bot that can arm the alarm system this is not a luxury."
H_BREMSE = "More attempts within a minute are rejected. This mainly limits guessing a PIN."
H_ERLAUBT = "One phone number per line, in international format (<span class='sm-mono'>+491701234567</span>, no spaces). Anyone not on the list cannot command the bot."
H_GRUPPE = "Leave empty and every message goes to each allowed sender individually. With a group id it goes to the group once; a message with <span class='sm-mono'>&amp;an=</span> stays an individual message. An urgent group message is acknowledged for everyone by the first allowed sender, and the bot reports this in the group. Anything else in groups is silently ignored – commands go through the private chat. The bot account must be a member of the group. The id appears in the output of <span class='sm-mono'>listGroups</span>."
H_HERZSCHLAG = "The bot writes a timestamp to the topic <span class='sm-mono'>online</span> every minute. <b>Deprecated since 0.9.30:</b> the sign of life via MQTT gateway V2 is <span class='sm-mono'>status/zaehler</span> and is always sent while MQTT is on. <span class='sm-mono'>online</span> is dropped at the earliest with the next version (announced)."
H_KONTO = "Usually filled in automatically after linking. The field shows the number only shortened; leave it empty to keep it."
H_KONTO_GEFUNDEN = "signal-cli knows these accounts: <span class='sm-mono'>%s</span>"
H_LOESEN = "Unlink the account"
H_MELDEWEGE = "Message paths"
H_NACHT = "During this period ordinary messages are held back and delivered afterwards. Messages marked <b>urgent</b> always go out immediately. Leaving both fields empty switches quiet hours off."
H_PIN = "Applies to all commands of level <i>PIN</i>. Leaving it empty does not change the stored PIN."
H_PIN_SPERRE = "Applies per sender and expires by itself."
H_PIN_VERSUCHE = "After that the PIN is locked for this sender for a while. Without this limit only the rate brake stands in the way of guessing - that is not enough."
H_QUITTUNG = "An urgent message is repeated until the recipient replies <span class='sm-mono'>quittiert</span>. 0 repeats means: send once, do not follow up."
H_RPC = "Address of the signal-cli service. If it runs on this LoxBerry, leave <span class='sm-mono'>http://127.0.0.1:8095</span>. If signal-cli runs elsewhere — for instance in a Docker image with ARM support — put its address here."
H_SICHERUNG = "Back up and restore settings"
H_SPERRE = "Kill switch"
H_STILLE = "Recommended. A reply would confirm to strangers that a bot is listening here. Someone who merely mistyped notices the missing echo just as well."
