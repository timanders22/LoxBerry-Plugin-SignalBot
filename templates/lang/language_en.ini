H_VERKNUEPFUNG = "Link the Signal account"
H_WEITERES = "Further settings"
H_ZUSTAND = "Loxone reports states through the endpoint, the bot prints them on the word <span class='sm-mono'>status</span>. Without this tick it does not answer that."
