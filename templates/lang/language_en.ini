H_KONTO_GEFUNDEN = "signal-cli knows these accounts: <span class='sm-mono'>%s</span>"
H_MELDEWEGE = "Message paths"
H_NACHT = "During this period ordinary messages are held back and delivered afterwards. Messages marked <b>urgent</b> always go out immediately. Leaving both fields empty switches quiet hours off."
