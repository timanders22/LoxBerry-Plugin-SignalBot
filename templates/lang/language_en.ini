LOESEN_TEXT = "<b>Two steps, and the first one belongs on the phone.</b><ol><li><b>On the phone:</b> open Signal, <i>Settings → Linked devices</i>, delete the entry <span class='sm-mono'>LoxBerry Signal Bot</span>. That is what actually removes the link - only the primary device can do it.</li><li><b>Here:</b> press the button below. It deletes the keys stored on the LoxBerry and clears the account field. Without this step the keys would stay behind, and a new link would meet an account the bot still believes it knows.</li></ol>The <b>Signal account itself is not touched</b> - your number, your chats and the phone are unaffected. Deleting the keys cannot be undone; for a new link the QR code is simply created again."
