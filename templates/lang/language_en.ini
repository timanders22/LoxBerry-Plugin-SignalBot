[LOX]
ANALOG = "analogue"
DIGITAL = "digital"
H_RICHTUNGEN = "Two directions"
H_VORLAGE = "Create everything at once"
K_VORLAGE = "Create template for Loxone Config"
K_VORLAGE_OUT = "Create template for virtual outputs"
RICHTUNGEN_TEXT = "This plugin works in both directions. <b>From the chat to Loxone</b> runs over MQTT: a command becomes a pulse on a topic. <b>From Loxone into the chat</b> runs over the endpoint: the Miniserver calls an address, the bot sends the message."
S0 = "From chat to Loxone everything runs over <b>MQTT</b>. That is the standard path: the gateway creates the names of the virtual inputs itself, in Loxone a matching input is enough. UDP would be the fallback and needs its own command recognition per value - this plugin does not need it. The MQTT gateway has been <b>part of the system</b> since LoxBerry 3 and is switched on under System &rarr; MQTT Gateway; it is not a plugin. From Loxone to the chat it works the other way round, through the endpoint called by a virtual output."
S0_T = "Step 1: Choose the path"
S1 = "One virtual input per command, listening on the topic from the command table:"
S1_IMPULS = "The bot sends <b>a pulse</b>, not a permanent value. In Loxone this needs a pulse generator or an edge behind it — a switch that stays at 1 would fire again after a gateway restart."
S2 = "A virtual output calling this address. The text is appended and must be URL encoded:"
S2_BILD = "With <span class='sm-mono'>&amp;bild=</span> an image is attached - for example the camera snapshot for an alarm. The file must be inside the plugin data folder or under /tmp and readable:"
S2_DRINGEND = "<b>Urgent</b> with <span class='sm-mono'>&amp;dringend=1</span>: the message goes out immediately even during quiet hours and is repeated until somebody replies <span class='sm-mono'>quittiert</span>."
S2_HINWEIS = "Without <span class='sm-mono'>&amp;an=</span> the message goes to <b>all</b> allowed senders. With <span class='sm-mono'>&amp;an=+44...</span> to exactly one — who must also be on the allow list, otherwise the endpoint rejects it. A <span class='sm-mono'>\n</span> in the text becomes a line break."
S2_SPERRE = "<b>Kill switch.</b> These two addresses lock the bot and release it again - meant for the case that a phone goes missing:"
S2_T = "From Loxone into the chat: sending messages"
S1_T = "From the chat to Loxone: receiving commands"
S3 = "One virtual output per state, triggered on change:"
S3_HINWEIS = "The bot prints all reported states on the word <span class='sm-mono'>status</span>. At most 50 are kept, the oldest drop out."
S3_T = "Reporting states so the bot can answer them"
S4 = "Work through the table from top to bottom and the function is rebuilt. The blocks are found in Loxone Config via the block search (F5)."
S4_ERLAEUTERUNG = "<b>On #2:</b> do not connect the pulse from #1 directly to the alarm block, but through a flag that the keypad in the hallway also sets — otherwise there are two paths into arming that know nothing of each other.<br><b>On #5:</b> set the threshold well above one minute. Cron restarts the bot every minute; a shorter threshold reports an outage that is none."
S4_T = "Complete block list to rebuild"
SABO = "Under System &rarr; MQTT Gateway &rarr; Subscriptions add exactly this line:"
SABO_T = "Step 2: Add the subscription in the MQTT gateway"
SAUS = "<b>A virtual input keeps its last value.</b> If the bot dies, everything looks normal in the app - the state simply stops moving. The heartbeat is the remedy: every minute the bot writes a timestamp to"
SAUS_HINWEIS = "In Loxone put an analogue input on it and evaluate it with an <b>on-delay of at least 180 seconds</b>. The threshold must be well above the interval: cron restarts the bot every minute, and a single missed round is not a failure. <span class='sm-mono'>SIGNAL_OK</span> from the template does the same if MQTT is not used."
SAUS_T = "Step 7: Failure detection"
SGEGEN = "Whether the address and its token are correct can be checked <b>without anything happening</b>. Open this address in a browser - it switches nothing and sends nothing:"
SGEGEN_2 = "The answer must be <span class='sm-mono'>SELFTEST;OK=1;TOKEN=OK</span>. If <span class='sm-mono'>OK=0</span> or HTTP 403 comes back, the token in the address is no longer correct. After that check under <i>Incoming overview</i> in the MQTT gateway whether the topics arrive, and dry-run a command in the <i>Test</i> tab."
SGEGEN_T = "Step 9: Verification"
SVI = "Loxone fetches these values from the bot itself - one virtual HTTP input with the command recognitions below. The button further down creates the ready-made import file; the table stays anyway, because it explains what is being imported."
SVI_ADRESSE = "Address of the input (polling time 60 s):"
SVI_HOST = "<b>Check the host name.</b> It comes from the call to this page and is only a suggestion - what counts is the name or address under which the <i>Miniserver</i> reaches the LoxBerry."
SVI_T = "Step 4: Virtual inputs for the state of the bot"
